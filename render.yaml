# Render Blueprint — one Node web service, matching the deployment target in
# CLAUDE.md: `npm start` serves the built dist/ and the API on a single port,
# so there is no CORS and no second host to manage.
#
# Render assigns PORT at runtime; server/index.js already reads it.

services:
  - type: web
    name: msametgok-com
    runtime: node
    plan: free
    region: virginia
    branch: main

    # --include=dev is load-bearing. Vite is a devDependency, so if NODE_ENV
    # is ever production at build time a plain `npm ci` would omit it and the
    # build would fail on a missing vite binary.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # Liveness only. This answers 200 even with no SMTP vars set — the body
    # then reads {"mail":"logging only"}, meaning the site is up but contact
    # messages are going to the log. A green deploy is not proof the form
    # delivers; read the body for that.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "24"

      # Secrets are never committed. sync: false tells Render to prompt for
      # these once in the dashboard and keep them out of this file.
      #
      # Mail leaves over Resend's HTTPS API because Render blackholes outbound
      # SMTP — the old SMTP_HOST/PORT/USER vars are unused and can be deleted
      # from the dashboard. SMTP_PASS and SMTP_FROM still work as fallbacks, so
      # a deploy cannot break in the window before they are renamed.
      - key: CONTACT_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
